<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Audit WMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E4E5DF; --panel:#FAFAF8; --panel-2:#EFEFEA; --panel-3:#E6E7E1;
  --ink:#0E1110; --ink-2:#555A56; --ink-3:#868B85;
  --rule:#C6C8C0; --hard:#0E1110;
  --hv:#F2C200; --hv-ink:#0E1110;
  --ok:#17683F; --ok-bg:#DDECE2; --ok-line:#2E9160;
  --warn:#9C5A05; --warn-bg:#F6E7CB; --warn-line:#D08A19;
  --bad:#A92A1E; --bad-bg:#F6DCD8; --bad-line:#D0483A;
  --info:#1C4E8A; --info-bg:#DCE6F1; --info-line:#3C77BF;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Manrope",var(--sans);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --side:236px;
  --c1:#4F46E5; --c2:#0D9488; --c3:#D97706; --c4:#0284C7;
  --c5:#7C3AED; --c6:#DB2777; --c7:#059669; --c8:#DC2626; --c9:#0891B2;
  box-sizing:border-box; color-scheme:light dark;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#101315; --panel:#191D20; --panel-2:#212629; --panel-3:#2A3034;
  --ink:#EDEFEA; --ink-2:#A4AAA4; --ink-3:#7B817B;
  --rule:#333A3E; --hard:#4E575C;
  --ok:#74D29E; --ok-bg:#15301F; --ok-line:#3F9E68;
  --warn:#E8AD52; --warn-bg:#33260F; --warn-line:#B27E24;
  --bad:#F2887A; --bad-bg:#371814; --bad-line:#B8503F;
  --info:#93B9E9; --info-bg:#152439; --info-line:#4A7EC0;
  --c1:#8B85FF; --c2:#3FC7B4; --c3:#F0A93C; --c4:#4FB0EC;
  --c5:#B18CFF; --c6:#F472B6; --c7:#41C98E; --c8:#F4776A; --c9:#38BBD9;
}}
:root[data-theme="dark"]{
  --paper:#101315; --panel:#191D20; --panel-2:#212629; --panel-3:#2A3034;
  --ink:#EDEFEA; --ink-2:#A4AAA4; --ink-3:#7B817B;
  --rule:#333A3E; --hard:#4E575C;
  --ok:#74D29E; --ok-bg:#15301F; --ok-line:#3F9E68;
  --warn:#E8AD52; --warn-bg:#33260F; --warn-line:#B27E24;
  --bad:#F2887A; --bad-bg:#371814; --bad-line:#B8503F;
  --info:#93B9E9; --info-bg:#152439; --info-line:#4A7EC0;
  --c1:#8B85FF; --c2:#3FC7B4; --c3:#F0A93C; --c4:#4FB0EC;
  --c5:#B18CFF; --c6:#F472B6; --c7:#41C98E; --c8:#F4776A; --c9:#38BBD9;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body,button,input,select,textarea{font-feature-settings:"cv02","cv03","cv04","cv11";letter-spacing:-.005em}
h1,h2,h3,h4,.logo b,.nb,.bkc .k,.mode-banner strong,.scan-count{letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--hv);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top{position:sticky;top:0;z-index:60;color:#EDEFEA;
  background:linear-gradient(100deg,#0E1110 0%,#152733 38%,#221A3A 72%,#2A1730 100%);
  padding:calc(9px + env(safe-area-inset-top,0px)) 16px 9px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--hv)}
.logo{display:flex;align-items:center;gap:9px}
.logo svg{display:block}
.logo b{font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.02em;line-height:1}
.logo i{font-style:normal;font-family:var(--mono);font-size:10px;color:#9AA09A;display:block;letter-spacing:.06em}
.top .sp{flex:1}
.chip{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:2px;
  background:rgba(255,255,255,.1);color:#C6CAC4;white-space:nowrap}
.chip.live{background:var(--hv);color:#0E1110;font-weight:600}
.who{display:flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:600;font-size:15px}
.av{width:28px;height:28px;border-radius:50%;background:var(--hv);color:#0E1110;
  display:grid;place-items:center;font-family:var(--cond);font-weight:700;font-size:14px}
.ib{background:none;border:1px solid rgba(255,255,255,.22);color:inherit;border-radius:3px;
  padding:4px 9px;cursor:pointer;font-size:13px;font-family:var(--cond);font-weight:600}
.ib:hover{background:rgba(255,255,255,.1)}

.shell{display:flex;align-items:flex-start;max-width:1560px;margin:0 auto}
aside{width:var(--side);flex:0 0 var(--side);position:sticky;top:64px;
  padding:16px 10px;max-height:calc(100vh - 64px);overflow-y:auto}
.navgrp{font-family:var(--cond);font-weight:600;font-size:12px;letter-spacing:.09em;
  color:var(--ink-3);padding:12px 10px 5px}
.nb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:var(--panel);border:1px solid var(--rule);border-left:4px solid transparent;
  border-radius:3px;padding:8px 11px;margin-bottom:6px;
  font-family:var(--cond);font-weight:600;font-size:17px;color:var(--ink-2)}
.nb:hover{background:var(--panel-2);color:var(--ink);border-left-color:var(--acc)}
.nb[aria-current="true"]{background:var(--ink);color:#F5F6F2;border-color:var(--ink);border-left-color:var(--acc)}
.nb .ic{width:25px;height:25px;flex:0 0 25px;display:grid;place-items:center;border-radius:6px;
  background:var(--acc);color:#fff;font-size:13px;line-height:1}
.nb .bdg{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--panel-3);
  color:var(--ink-2);padding:1px 6px;border-radius:9px}
.nb[aria-current="true"] .bdg{background:var(--hv);color:#0E1110;font-weight:600}
main{flex:1;min-width:0;padding:18px 16px 90px}

@media (max-width:920px){
  .shell{display:block}
  aside{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:none;z-index:55;
    display:flex;gap:6px;overflow-x:auto;background:var(--panel);border-top:2px solid var(--hard);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));scrollbar-width:none}
  aside::-webkit-scrollbar{display:none}
  .navgrp{display:none}
  .nb{width:auto;flex:0 0 auto;margin:0;font-size:15px;padding:7px 12px;border-left-width:1px;border-bottom:3px solid transparent}
  .nb[aria-current="true"]{border-bottom-color:var(--hv)}
  .nb .bdg{margin-left:6px}
  main{padding:14px 11px 108px}
}

h2{font-family:var(--cond);font-weight:700;font-size:29px;margin:0 0 3px;letter-spacing:.01em}
h3{font-family:var(--cond);font-weight:700;font-size:20px;margin:0 0 9px}
h4{font-family:var(--cond);font-weight:600;font-size:16px;margin:0 0 7px;color:var(--ink-2);letter-spacing:.03em}
.sub{color:var(--ink-2);margin:0 0 18px;max-width:70ch}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:16px;margin-bottom:16px}
.card > h3:first-child{margin-top:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:980px){.split{grid-template-columns:1fr}}

label.f{display:block;min-width:0}
label.f>span{display:block;font-family:var(--cond);font-weight:600;font-size:13px;
  color:var(--ink-2);margin-bottom:3px;letter-spacing:.04em}
input,select,textarea{width:100%;background:var(--panel);border:1px solid var(--hard);
  border-radius:2px;padding:8px 9px;font-family:var(--mono);font-size:14px}
textarea{font-size:13px;line-height:1.5;resize:vertical}
input:disabled,input[readonly]{background:var(--panel-3);color:var(--ink-2);border-color:var(--rule)}
input.big{font-size:19px;padding:11px;font-weight:500}
.ro{font-family:var(--cond);font-weight:700;font-size:20px;text-align:center;
  padding:6px 4px;border:1px solid var(--rule);border-radius:2px;background:var(--panel-3);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.ro.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-line)}
.ro.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.ro.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line)}
.ro.info{color:var(--info);background:var(--info-bg);border-color:var(--info-line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--ink);color:var(--paper);border:1px solid var(--ink);border-radius:2px;
  padding:9px 15px;cursor:pointer;font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.25)}
.btn.hv{background:var(--hv);color:var(--hv-ink);border-color:var(--hv)}
.btn.hv:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok-line);border-color:var(--ok-line);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--hard)}
.btn.ghost:hover{background:var(--panel-2);filter:none}
.btn.sm{padding:4px 9px;font-size:14px}
.btn.xs{padding:2px 7px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.block{width:100%}

table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-align:left;
  color:var(--ink-2);padding:7px 9px;border-bottom:2px solid var(--hard);white-space:nowrap;
  background:var(--panel-2);position:sticky;top:0;z-index:2}
td{padding:6px 9px;border-bottom:1px solid var(--rule);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:hover{background:var(--panel-2)}
tr.edit-on{background:var(--warn-bg)!important;box-shadow:inset 3px 0 0 var(--warn-line)}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
.scroll.cap{max-height:460px}
.code{font-family:var(--mono);font-size:13px}
.muted{color:var(--ink-3)}
.nowrap{white-space:nowrap}

.tag{display:inline-block;font-family:var(--cond);font-weight:600;font-size:12.5px;
  padding:1px 7px;border-radius:2px;letter-spacing:.03em;white-space:nowrap;border:1px solid transparent}
.tag.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.tag.info{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.tag.idle{background:var(--panel-3);color:var(--ink-2);border-color:var(--rule)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 14px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rule)}
.tile.g::before{background:var(--ok-line)} .tile.y::before{background:var(--hv)}
.tile.r::before{background:var(--bad-line)} .tile.b::before{background:var(--info-line)}
.tile.g{background:linear-gradient(135deg,var(--ok-bg) 0%,var(--panel) 62%)}
.tile.y{background:linear-gradient(135deg,var(--warn-bg) 0%,var(--panel) 62%)}
.tile.r{background:linear-gradient(135deg,var(--bad-bg) 0%,var(--panel) 62%)}
.tile.b{background:linear-gradient(135deg,var(--info-bg) 0%,var(--panel) 62%)}
.tile .k{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.05em;color:var(--ink-2)}
.tile .v{font-family:var(--cond);font-weight:700;font-size:33px;line-height:1.02;
  font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-word}
.tile .v small{font-size:16px;font-weight:600;color:var(--ink-2)}
.tile .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-top:3px}

.bar{height:8px;background:var(--panel-3);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.bar>i.ok{background:var(--ok-line)}.bar>i.warn{background:var(--warn-line)}
.bar>i.bad{background:var(--bad-line)}.bar>i.info{background:var(--info-line)}

.empty{border:2px dashed var(--hard);border-radius:4px;padding:36px 22px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink)}
.hint{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:5px;min-height:1.1em}
.hint.bad{color:var(--bad)}.hint.ok{color:var(--ok)}.hint.warn{color:var(--warn)}
.banner{border-left:4px solid var(--info-line);background:var(--info-bg);color:var(--info);
  padding:10px 13px;border-radius:3px;margin-bottom:14px;font-size:14px}
.banner.w{border-color:var(--warn-line);background:var(--warn-bg);color:var(--warn)}

.oner{display:grid;gap:8px;align-items:end;
  grid-template-columns:1.1fr 1.5fr 1.05fr 1.15fr 1.15fr .72fr .72fr .72fr .68fr auto}
@media(max-width:1280px){.oner{grid-template-columns:repeat(5,1fr)}}
@media(max-width:700px){.oner{grid-template-columns:repeat(2,1fr)}.oner .wide{grid-column:span 2}}
.seg{display:inline-flex;border:1px solid var(--hard);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--rule);padding:6px 12px;
  cursor:pointer;font-family:var(--cond);font-weight:600;font-size:15px;color:var(--ink-2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}

.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:10px}
.shcard{text-align:left;width:100%;cursor:pointer;background:var(--panel);
  border:1px solid var(--rule);border-left:6px solid var(--ink-3);border-radius:4px;padding:11px 13px}
.shcard:hover{border-color:var(--hard);border-left-color:var(--hv)}
.shcard.done{border-left-color:var(--ok-line);background:var(--ok-bg)}
.shcard.part{border-left-color:var(--hv)}
.shcard .id{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1.1;word-break:break-all}
.shcard .mt{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin:3px 0 7px}
.shcard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:7px}

.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px;margin-bottom:16px}
.bkc{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px 13px;
  cursor:pointer;text-align:left;border-top:6px solid var(--rule)}
.bkc[aria-pressed="true"]{background:var(--panel-2);border-color:var(--hard);box-shadow:0 0 0 2px var(--hv) inset}
.bkc.ok{background:linear-gradient(160deg,var(--ok-bg),var(--panel) 68%)}
.bkc.info{background:linear-gradient(160deg,var(--info-bg),var(--panel) 68%)}
.bkc.warn{background:linear-gradient(160deg,var(--warn-bg),var(--panel) 68%)}
.bkc.bad{background:linear-gradient(160deg,var(--bad-bg),var(--panel) 68%)}
.card{border-radius:6px}
h2{border-bottom:3px solid var(--acc,var(--hv));display:inline-block;padding-bottom:2px}
.bkc .k{font-family:var(--cond);font-weight:700;font-size:16px}
.bkc .v{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.bkc .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}

.gate{max-width:390px;margin:8vh auto;padding:0 16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));
  z-index:200;background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:3px;
  font-family:var(--cond);font-weight:600;font-size:16px;max-width:92vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.3)}
.toast.err{background:var(--bad-line);color:#fff}
.toast.good{background:var(--ok-line);color:#fff}
@media(min-width:921px){.toast{bottom:22px}}
details.help{border:1px solid var(--rule);border-radius:4px;padding:0 13px;background:var(--panel);margin-bottom:16px}
details.help summary{cursor:pointer;padding:11px 0;font-family:var(--cond);font-weight:600;font-size:17px}
details.help[open]{padding-bottom:13px}
details.help code{font-family:var(--mono);font-size:12.5px;background:var(--panel-3);padding:1px 4px;border-radius:2px}
.foot{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);padding:14px 2px;border-top:1px solid var(--rule);margin-top:24px}

/* Professional category-cycle UI */
.category-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid var(--rule);border-radius:999px;background:var(--panel-2);font:600 12px var(--cond);letter-spacing:.02em}
.mode-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--rule);border-radius:8px;background:linear-gradient(135deg,var(--panel-2),var(--panel));margin-bottom:10px}
.mode-banner strong{font:700 16px var(--cond)}
.scan-focus{border:1px solid var(--hard);box-shadow:0 8px 24px rgba(0,0,0,.08);background:var(--panel);padding:14px;border-radius:9px}
.scan-focus .scan-input{font-size:24px;height:52px;border-width:2px}
.scan-count{font:700 34px var(--cond);font-variant-numeric:tabular-nums}
.category-pills{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}
.category-pills .pill{padding:5px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--panel-2);font:600 12px var(--cond)}
.category-pills .pill.active{border-color:var(--hv);box-shadow:0 0 0 2px var(--hv) inset}
.template-card{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
@media(max-width:700px){.scan-focus .scan-input{font-size:20px}.scan-count{font-size:28px}}

/* Cycle Count WMS compact UI refresh */
.navgrp{padding:8px 8px 4px;font-size:10px}
.nb{gap:7px;padding:6px 8px;margin-bottom:4px;font-size:14px;border-radius:5px}
.nb .ic{width:22px;height:22px;flex-basis:22px;border-radius:5px}
main{padding:14px 14px 80px}
h2{font-size:25px}
.card{padding:12px;margin-bottom:10px;border-radius:7px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:7px;margin-bottom:10px}
.tile{padding:8px 10px;border-radius:7px}
.tile::before{width:3px}
.tile .k{font-size:11px}.tile .v{font-size:26px}.tile .v small{font-size:13px}.tile .d{font-size:10px}
.bk{grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:7px;margin-bottom:10px}
.bkc{padding:8px 10px;border-radius:7px;min-height:82px}
.bkc .v{font-size:25px}.bkc .k{font-size:11px}.bkc .d{font-size:10px}
.shelves{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:7px}
.shcard{border-left-width:4px;padding:8px 10px;border-radius:6px}.shcard .id{font-size:17px}.shcard .mt{font-size:10px;margin:2px 0 5px}.shcard .ft{margin-top:5px}
.btn{padding:7px 11px;font-size:14px;border-radius:5px}.btn.sm{padding:4px 8px;font-size:12px}.btn.xs{padding:2px 6px;font-size:11px}
.compact-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.report-actions{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.cycle-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--rule);padding:8px 10px;border-radius:7px;margin-bottom:10px}
.cycle-bar .state{font-family:var(--cond);font-weight:700;font-size:13px}

<body>
<div id="root"></div>
<script>
"use strict";
const APP="Stock Audit WMS", LS="wms.sc.v2";
const BRACKETS=[
  {k:"b60",label:"Above 60%",min:60,max:Infinity,cls:"ok",   note:"Fresh stock"},
  {k:"b40",label:"40% to 60%",min:40,max:60,     cls:"info", note:"Normal rotation"},
  {k:"b25",label:"25% to 40%",min:25,max:40,     cls:"warn", note:"Move first"},
  {k:"b00",label:"Below 25%",min:-Infinity,max:25,cls:"bad", note:"Short life / expired"}
];
const bracketOf=p=>BRACKETS.find(b=>p>=b.min&&p<b.max)||BRACKETS[3];

const S={
  master:[], lines:[], shelfDone:{}, users:[],
  cfg:{minLifePct:50, job:"", author:"Arvind Kumar", site:"", ccComplete:false, deletedShelves:{},shelfLocks:{}},
  cloud:{url:"", key:"", auto:true, lastPush:"", lastPull:"", err:""},
  me:null, view:"dash", activeShelf:null, editId:null,
  filter:"all", q:"", bkFilter:"all", searchQ:"",
  booted:false, dirty:{master:false,lines:false,state:false,users:false}
};
let DB=null, DL=null;
const SANDBOX = !!(typeof window!=="undefined" && window.claude && window.claude.use);

const $=s=>document.querySelector(s);
const el=(t,a,...c)=>{const n=document.createElement(t);
  for(const k in (a||{})){const v=a[k];
    if(v===null||v===undefined||v===false)continue;
    if(k==="class")n.className=v; else if(k==="html")n.innerHTML=v;
    else if(k==="text")n.textContent=v; else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);}
  for(const x of c.flat()){if(x==null||x===false)continue;n.append(x.nodeType?x:document.createTextNode(x));}
  return n;};
const NS="http://www.w3.org/2000/svg";
const sv=(t,a,...c)=>{const n=document.createElementNS(NS,t);
  for(const k in (a||{})) if(a[k]!=null) n.setAttribute(k,a[k]);
  c.flat().forEach(x=>{if(x)n.append(x.nodeType?x:document.createTextNode(x))}); return n;};
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[, ]/g,""));return isFinite(n)?n:0};
const fmt=n=>{const r=Math.round(n*1000)/1000;return r.toLocaleString("en-IN",{maximumFractionDigits:3})};
const sgn=n=>(n>0?"+":"")+fmt(n);
const norm=s=>String(s==null?"":s).trim().toUpperCase();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const tstamp=s=>{try{return new Date(s).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return""}};
let tT;function toast(m,k){clearTimeout(tT);let t=$("#toast");if(!t){t=el("div",{id:"toast"});document.body.append(t)}
  t.className="toast "+(k||"");t.textContent=m;tT=setTimeout(()=>t.remove(),k==="err"?3600:1900)}

const DAY=864e5;
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||"").trim());if(!m)return null;
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));return isNaN(d.getTime())?null:d};
const today=()=>{const n=new Date();return new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))};
const dd=(a,b)=>Math.round((b-a)/DAY);
function monthsBetween(a,b){let m=(b.getUTCFullYear()-a.getUTCFullYear())*12+(b.getUTCMonth()-a.getUTCMonth());
  const at=y=>new Date(Date.UTC(a.getUTCFullYear(),a.getUTCMonth()+y,a.getUTCDate()));
  if(at(m)>b)m--; const lo=at(m),hi=at(m+1); return m+(hi>lo?(b-lo)/(hi-lo):0)}
function life(mfg,exp){
  const M=pd(mfg),E=pd(exp),T=today();
  if(!M||!E||E<=M)return null;
  const totalDays=dd(M,E),remDays=dd(T,E),ageDays=dd(M,T);
  const pct=totalDays>0?(remDays/totalDays)*100:0;
  return{totalDays,remDays,ageDays,totalMonths:monthsBetween(M,E),pct,
    expired:remDays<0, bracket:bracketOf(pct),
    status:remDays<0?"bad":(pct<S.cfg.minLifePct?"warn":"ok")};
}

function reconcile(shelf){
  const m=new Map();
  for(const r of S.master) if(r.shelf===shelf){
    const e=m.get(r.sku)||{sku:r.sku,desc:r.desc,uom:r.uom,systemQty:0,scanned:0,lines:[]};
    e.systemQty+=r.qty; if(!e.desc)e.desc=r.desc; m.set(r.sku,e);}
  for(const l of S.lines) if(l.shelf===shelf){
    const e=m.get(l.sku)||{sku:l.sku,desc:"",uom:"",systemQty:0,scanned:0,lines:[],extra:true};
    e.scanned+=l.qty; e.lines.push(l); m.set(l.sku,e);}
  return [...m.values()].map(e=>({...e,diff:e.scanned-e.systemQty,touched:e.lines.length>0}))
    .sort((a,b)=>a.sku<b.sku?-1:a.sku>b.sku?1:0);
}
function shelfStat(shelf){
  const mR=S.master.filter(r=>r.shelf===shelf), lR=S.lines.filter(l=>l.shelf===shelf);
  const sysQty=mR.reduce((s,r)=>s+r.qty,0), cntQty=lR.reduce((s,l)=>s+l.qty,0);
  const skuSet=new Set(mR.map(r=>r.sku)), cnt=new Set(lR.map(l=>l.sku));
  const sub=S.shelfDone[shelf]||null;
  return{shelf,sysQty,cntQty,diff:cntQty-sysQty,skuTotal:skuSet.size,
    skuCounted:[...cnt].filter(s=>skuSet.has(s)).length,
    extraSku:[...cnt].filter(s=>!skuSet.has(s)).length,
    lines:lR.length, sub, done:!!sub,
    state:sub?"done":(lR.length?"part":"pending"),
    by:sub?sub.byName:(lR.length?lR[lR.length-1].byName:"")};
}
function allShelves(){
  const k=new Set([...S.master.map(r=>r.shelf),...S.lines.map(l=>l.shelf)]);
  return [...k].sort().map(shelfStat);
}
function totals(){
  const st=allShelves();
  const sysQty=S.master.reduce((s,r)=>s+r.qty,0), cntQty=S.lines.reduce((s,l)=>s+l.qty,0);
  const sysK=new Set(S.master.map(r=>r.shelf+"\u0000"+r.sku));
  const cntK=new Set(S.lines.map(l=>l.shelf+"\u0000"+l.sku));
  let matched=0; cntK.forEach(k=>{if(sysK.has(k))matched++});
  return{shelves:st.length, done:st.filter(s=>s.state==="done").length,
    part:st.filter(s=>s.state==="part").length, pending:st.filter(s=>s.state==="pending").length,
    skuTotal:sysK.size, skuCounted:matched, skuExtra:cntK.size-matched,
    sysQty,cntQty,diff:cntQty-sysQty, lines:S.lines.length,
    accuracy:sysQty>0?Math.max(0,100-Math.abs(cntQty-sysQty)/sysQty*100):0, stats:st};
}
function bracketAgg(){
  const map={}; BRACKETS.forEach(b=>map[b.k]={...b,qty:0,lines:0,skus:new Set()});
  let undated=0,uq=0;
  S.lines.forEach(l=>{const L=life(l.mfg,l.exp);
    if(!L){undated++;uq+=l.qty;return}
    const e=map[L.bracket.k]; e.qty+=l.qty; e.lines++; e.skus.add(l.sku);});
  return{list:BRACKETS.map(b=>({...map[b.k],skuCount:map[b.k].skus.size})),undated,undatedQty:uq};
}

function snap(){try{localStorage.setItem(LS,JSON.stringify(
  {master:S.master,lines:S.lines,shelfDone:S.shelfDone,cfg:S.cfg,users:S.users,
   cloud:S.cloud,me:S.me&&S.me.id}))}catch(e){}}
function loadLocal(){try{const d=JSON.parse(localStorage.getItem(LS)||"null");if(!d)return null;
  S.master=d.master||[];S.lines=d.lines||[];S.users=d.users||[];
  S.shelfDone=migrate(d.shelfDone||{});S.cfg=Object.assign(S.cfg,d.cfg||{});
  S.cloud=Object.assign(S.cloud,d.cloud||{});return d.me}catch(e){return null}}
function migrate(sd){const o={};for(const k in sd){const v=sd[k];
  o[k]=(v&&typeof v==="object")?v:{by:"",byName:"—",at:""}}return o}
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
let sT=null,busy=false;
function save(...what){what.forEach(w=>S.dirty[w]=true);snap();clearTimeout(sT);sT=setTimeout(flush,450);
  if(!SANDBOX&&S.cloud.auto&&S.cloud.url) queuePush()}

/*────── Google Apps Script bridge ──────*/
let pT=null, pushing=false;
function payload(){return{master:S.master,lines:S.lines,shelfDone:S.shelfDone,cfg:S.cfg,users:S.users}}
function queuePush(){clearTimeout(pT);pT=setTimeout(()=>{cloudPush(true).catch(()=>{})},3500)}
let syncPollT=null;
function startCloudPolling(){
  clearInterval(syncPollT);
  syncPollT=setInterval(async()=>{
    if(!S.booted||!S.me||!S.cloud.url||!S.cloud.key||pushing||Object.values(S.dirty).some(Boolean))return;
    try{await cloudPull(true); if(S.view!=="scan"||!S.activeShelf) render();}catch(e){}
  },5000);
}
function cloudChip(txt,cls){const c=$("#cloudChip");if(!c)return;
  c.className="chip"+(cls?" "+cls:"");c.textContent=txt}
async function cloudCall(body,qs){
  if(SANDBOX) throw new Error("Blocked inside Claude — run the GitHub Pages copy for this");
  const url=String(S.cloud.url||"").trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))
    throw new Error("Paste the /exec web app URL from Apps Script first");
  let res;
  if(qs){ res=await fetch(url+(url.indexOf("?")>=0?"&":"?")+qs,{method:"GET",redirect:"follow"}) }
  else  { res=await fetch(url,{method:"POST",redirect:"follow",body:JSON.stringify(body)}) }
  const txt=await res.text();
  let j; try{j=JSON.parse(txt)}catch(e){throw new Error("Apps Script replied with a page, not JSON. Re-deploy with access set to Anyone.")}
  if(!j.ok) throw new Error(j.error||"Apps Script refused the request");
  return j;
}
async function cloudPing(){
  const j=await cloudCall(null,"action=ping&key="+encodeURIComponent(S.cloud.key));
  S.cloud.err="";return j;
}
function mergeClientPayload(remote,local){
  const r=remote||{}, l=local||{};
  const byId=new Map();
  (r.lines||[]).forEach(x=>byId.set(x.id||uid(),x));
  (l.lines||[]).forEach(x=>byId.set(x.id||uid(),x));
  const sd=Object.assign({},r.shelfDone||{},l.shelfDone||{});
  const cfg=Object.assign({},r.cfg||{},l.cfg||{});
  cfg.deletedShelves=Object.assign({},(r.cfg||{}).deletedShelves||{},(l.cfg||{}).deletedShelves||{});
  cfg.ccComplete=!!((r.cfg||{}).ccComplete||(l.cfg||{}).ccComplete);
  const mm=new Map();
  (r.master||[]).forEach(x=>mm.set([x.shelf,x.sku].join("\u0000"),x));
  (l.master||[]).forEach(x=>mm.set([x.shelf,x.sku].join("\u0000"),x));
  const deleted=cfg.deletedShelves||{};
  const master=[...mm.values()].filter(x=>!deleted[x.shelf]);
  const lines=[...byId.values()].filter(x=>!deleted[x.shelf]);
  Object.keys(sd).forEach(k=>{if(deleted[k])delete sd[k]});
  return {master,lines,shelfDone:sd,cfg,users:l.users&&l.users.length?l.users:(r.users||[])};
}
async function cloudPush(silent){
  if(pushing)return; pushing=true; cloudChip("Sending…");
  try{
    let latest={master:[],lines:[],shelfDone:{},cfg:{},users:[]};
    try{const pj=await cloudCall(null,"action=pull&key="+encodeURIComponent(S.cloud.key));latest=pj.payload||latest}catch(e){}
    const merged=mergeClientPayload(latest,payload());
    S.master=merged.master;S.lines=merged.lines;S.shelfDone=migrate(merged.shelfDone);S.cfg=Object.assign(S.cfg,merged.cfg||{});S.users=merged.users||S.users;
    const j=await cloudCall({key:S.cloud.key,action:"push",payload:payload()});
    S.cloud.lastPush=new Date().toISOString();S.cloud.err="";
    Object.keys(S.dirty).forEach(k=>S.dirty[k]=false);
    snap();
    cloudChip("Sheet updated","live");
    if(!silent){toast("Sent to Google Sheets — "+(j.rows||0)+" scan rows","good");render()}
  }catch(e){
    S.cloud.err=e.message;snap();cloudChip("Sync failed");
    if(!silent)toast(e.message,"err");
    throw e;
  }finally{pushing=false}

async function cloudPull(silent){

async function hash(pw){
  const salt="shelfcount::";
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+pw));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h=5381;for(const c of salt+pw)h=((h<<5)+h+c.charCodeAt(0))>>>0;return "f"+h.toString(16);
}
async function createUser(name,username,pw,role){
  const u=norm(username);
  if(!name.trim()) throw new Error("Full name is required");
  if(!/^[A-Z0-9._-]{3,}$/.test(u)) throw new Error("Username needs 3+ characters, letters or digits");
  if(S.users.some(x=>x.username===u)) throw new Error("That username already exists");
  if(String(pw).length<4) throw new Error("Password needs at least 4 characters");
  const rec={id:uid(),name:name.trim(),username:u,role,h:await hash(pw),at:new Date().toISOString()};
  S.users.push(rec); save("users"); return rec;
}
async function login(username,pw){
  const u=S.users.find(x=>x.username===norm(username));
  if(!u) throw new Error("No such username");
  if(u.h!==await hash(pw)) throw new Error("Wrong password");
  S.me=u; snap(); return u;
}

function splitRows(text){const rows=[];let f="",row=[],q=false;
  const t=text.replace(/\r\n?/g,"\n"),h=t.split("\n")[0];
  const d=h.split("\t").length>h.split(",").length?"\t":",";
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true; else if(ch===d){row.push(f);f=""}
    else if(ch==="\n"){row.push(f);rows.push(row);row=[];f=""} else f+=ch}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));}
const HEAD={category:["category","cat","type","productcategory"],
  shelf:["shelf","shelfcode","location","loc","bin","binlocation","binno","rack","storagebin","shelfno","shelfid"],
  sku:["sku","skucode","item","itemcode","material","materialcode","product","productcode","article","partno","code","barcode","ean"],
  qty:["qty","quantity","systemqty","stock","stockqty","bookqty","onhand","soh","systemquantity","qtyonhand"],
  desc:["desc","description","itemname","productname","name","itemdescription","materialdescription"],
  uom:["uom","unit","units","measure","baseuom"]};
function parseImport(text){
  const rows=splitRows(text); if(!rows.length)return{error:"Nothing to read."};
  const key=c=>String(c).toLowerCase().replace(/[^a-z0-9]/g,"");
  let idx={};rows[0].forEach((c,i)=>{const k=key(c);
    for(const f in HEAD) if(idx[f]===undefined&&HEAD[f].indexOf(k)>=0)idx[f]=i});
  let body=rows.slice(1),headed=true;
  if(idx.shelf===undefined||idx.sku===undefined||idx.qty===undefined){
    const first=rows[0]||[], firstCat=norm(first[0]);
    if(first.length>=4 && ["APPAREL","COSMETICS","ELECTRONICS"].includes(firstCat)) idx={category:0,shelf:1,sku:2,qty:3};
    else if(first.length>=4) idx={shelf:0,sku:1,desc:2,qty:3};
    else idx={shelf:0,sku:1,qty:2};
    body=rows;headed=false}
  const out=[];let bad=0;
  body.forEach(r=>{const shelf=norm(r[idx.shelf]),sku=norm(r[idx.sku]);
    if(!shelf||!sku){bad++;return}
    const cat=idx.category!==undefined?String(r[idx.category]||"").trim().replace(/\s+/g," "):"Apparel";
    const category=cat||"Apparel";
    if(!["APPAREL","COSMETICS","ELECTRONICS"].includes(norm(category))){bad++;return}
    out.push({category:category.replace(/^./,x=>x.toUpperCase()),shelf:shelf,sku:sku,qty:num(r[idx.qty]),
      desc:idx.desc!==undefined?String(r[idx.desc]||"").trim():"",
      uom:idx.uom!==undefined?String(r[idx.uom]||"").trim():""})});
  if(!out.length)return{error:"No usable rows — Category, Shelf, SKU and Qty are required."};
  const cats=new Map();out.forEach(r=>{const c=cats.get(r.shelf)||new Set();c.add(norm(r.category));cats.set(r.shelf,c)});
  return{rows:out,skipped:bad,headed:headed};
}

function showRaw(card,grid){

async function copyTsv(grid,note){
  const txt=grid.map(r=>r.map(c=>String(c==null?"":c)).join("\t")).join("\n");
  try{ await navigator.clipboard.writeText(txt); note.className="hint ok";
    note.textContent=(grid.length-1)+" rows copied — paste into A1"; toast("Copied for Sheets","good"); return }
  catch(e){}
  try{const ta=el("textarea",{style:"position:fixed;opacity:0"});ta.value=txt;document.body.append(ta);
    ta.select();const ok=document.execCommand("copy");ta.remove();
    if(ok){note.className="hint ok";note.textContent="Copied — paste into A1";toast("Copied","good");return}}catch(e){}
  note.className="hint warn";note.textContent='Copy blocked — use "Show as text" and copy by hand';
}
async function download(filename,data){

function csvSkus(){

    e.phy+=l.qty;e.n++;e.sh.add(l.shelf);if(l.byName)e.who.add(l.byName);

  const p=el("input",{type:"password",placeholder:"password"});
  const r=el("select",{},el("option",{value:"operator"},"Operator — scans and counts"),

  c.append(el("div",{class:"oner",style:"grid-template-columns:repeat(auto-fit,minmax(170px,1fr))"},
    el("label",{class:"f"},el("span",{text:"Full name"}),n),
    el("label",{class:"f"},el("span",{text:"Username"}),u),
    el("label",{class:"f"},el("span",{text:"Password"}),p),
    el("label",{class:"f"},el("span",{text:"Role"}),r),
    el("button",{class:"btn hv",style:"height:38px",async onclick(){
      try{const x=await createUser(n.value,u.value,p.value,r.value);

    e.n++;e.q+=l.qty;e.sh.add(l.shelf);if(l.ts>e.last)e.last=l.ts;act.set(l.by,e)});
  const sub=new Map();
  Object.keys(S.shelfDone).forEach(k=>{const s=S.shelfDone[k];sub.set(s.by,(sub.get(s.by)||0)+1)});

  const tb=el("tbody");
  S.users.forEach(usr=>{

    tb.append(el("tr",{},
      el("td",{},el("span",{class:"av",style:"display:inline-grid;vertical-align:middle;margin-right:8px",text:initials(usr.name)}),
        usr.name,usr.id===S.me.id?el("span",{class:"tag idle",style:"margin-left:6px",text:"you"}):null),
      el("td",{class:"code",text:usr.username}),
      el("td",{},el("span",{class:"tag "+(usr.role==="admin"?"info":"idle"),text:usr.role==="admin"?"Admin":"Operator"})),
      el("td",{class:"n",text:fmt(a.n)}),el("td",{class:"n",text:fmt(a.q)}),
      el("td",{class:"n",text:fmt(a.sh.size)}),el("td",{class:"n",text:fmt(sub.get(usr.id)||0)}),
      el("td",{class:"code muted",text:a.last?tstamp(a.last):"—"}),
      el("td",{class:"nowrap"},[
        el("button",{class:"btn ghost xs",style:"margin-right:4px",async onclick(){
          const pw=prompt("New password for "+usr.name+" (min 4 characters)");

          usr.h=await hash(pw);save("users");toast("Password reset","good")}},"Reset password"),
        usr.id!==S.me.id?el("button",{class:"btn ghost xs",style:"margin-right:4px",onclick(){
          usr.role=usr.role==="admin"?"operator":"admin";save("users");
          toast(usr.name+" is now "+usr.role);render()}},
          usr.role==="admin"?"Make operator":"Make admin"):null,
        usr.id!==S.me.id?el("button",{class:"btn ghost xs",onclick(){
          if(!confirm("Remove "+usr.name+"?\n\nTheir "+a.n+" scan entries stay in the count with their name on them."))return;
          S.users=S.users.filter(x=>x.id!==usr.id);save("users");toast("User removed");render()}},"Remove"):null
      ])));
  });
  host.append(el("div",{class:"card"},el("h3",{text:"Team ("+S.users.length+")"}),
    el("div",{class:"scroll"},el("table",{},el("thead",{},el("tr",{},
      el("th",{text:"Name"}),el("th",{text:"Username"}),el("th",{text:"Role"}),
      el("th",{class:"n",text:"Entries"}),el("th",{class:"n",text:"Qty scanned"}),
      el("th",{class:"n",text:"Shelves touched"}),el("th",{class:"n",text:"Shelves submitted"}),
      el("th",{text:"Last activity"}),el("th",{text:"Manage"}))),tb))));

  const sd=Object.keys(S.shelfDone);

        el("th",{text:"Shelf"}),el("th",{text:"Submitted by"}),el("th",{text:"When"}),
        el("th",{class:"n",text:"Physical qty"}),el("th",{class:"n",text:"Difference"}),
        el("th",{text:"Status"}))),t2))));
  }
